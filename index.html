<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="星星官网 - 专业、创新的服务体验">
    <title>星星官网-生日快乐</title>
    <style>
        :root {
            --text-dark: #1d1d1f;
            --text-gray: #6e6e73;
            --text-light: #666;
            --border-light: #d2d2d6;
            --bg-gray: #f5f5f7;
            --nav-bg: #ffffff;
            --white: #fff;
            --footer-bg: #f5f5f7;
            --notification-bg: rgba(0, 0, 0, 0.8);
            --transition-speed: 0.3s;
            --greeting-size: 4rem;
            --welcome-size: 2.2rem;
            --nav-link-size: 1.1rem;
            --notification-size: 1.35rem;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: var(--bg-gray);
        }
        
        body.dark {
            --text-dark: #f5f5f7;
            --text-gray: #a1a1a6;
            --border-light: #38383a;
            --bg-gray: #0d0d0d;
            --nav-bg: #1c1c1e;
            --white: #2c2c2e;
            --footer-bg: #1c1c1e;
        }

        body.dark .notification {
            color: #fff;
        }

        body.dark .tm-day:hover:not(:disabled) {
            background: #3a3a3c;
        }

        body.dark .tm-close,
        body.dark .tm-nav-btn {
            background: #3a3a3c;
            color: #d1d1d6;
        }

        .theme-toggle {
            background: none;
            border: none;
            font-size: 1.25rem;
            cursor: pointer;
            padding: 0 4px;
            line-height: 44px;
            transition: transform 0.2s;
        }

        .theme-toggle:hover {
            transform: scale(1.15);
        }

        .globalnav {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            border-bottom: 1px solid var(--border-light);
            background-color: var(--nav-bg);
        }
        
        .globalnav-logo {
            height: 44px;
            display: flex;
            align-items: center;
        }
        
        .nav-logo {
            height: 44px;
            width: auto;
            display: block;
        }
        
        .globalnav-links {
            display: flex;
            gap: 25px;
            height: 44px;
            align-items: center;
        }
        
        .globalnav-link {
            text-decoration: none;
            color: var(--text-gray);
            font-size: var(--nav-link-size);
            transition: color var(--transition-speed);
            padding: 0;
            cursor: pointer;
            border-radius: 4px;
            line-height: 44px;
            display: inline-block;
        }
        
        .globalnav-link:hover {
            color: var(--text-dark);
        }
        
        .globalnav-link:focus-visible {
            outline: 2px solid var(--text-dark);
            outline-offset: 2px;
        }
        
        .notification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: var(--notification-bg);
            color: var(--white);
            padding: 15px 25px;
            border-radius: 8px;
            font-size: var(--notification-size);
            z-index: 1000;
            opacity: 0;
            transition: opacity var(--transition-speed);
            pointer-events: none;
            white-space: nowrap;
            font-weight: 500;
        }
        
        .notification.show {
            opacity: 1;
        }
        
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            text-align: center;
            min-height: calc(100vh - 44px);
        }
        
        .center-logo {
            max-width: 500px;
            width: 100%;
            height: auto;
            margin-bottom: 40px;
            animation: subtle-float 2s ease-in-out infinite;
            will-change: transform;
        }
        
        .greeting {
            font-size: var(--greeting-size);
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-dark);
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .greeting span {
            opacity: 0;
            animation: fadeIn 0.8s ease forwards;
        }
        
        .welcome-text {
            font-size: var(--welcome-size);
            color: var(--text-gray);
            line-height: 1.6;
            font-weight: 400;
        }

        .footer {
            background-color: var(--footer-bg);
            padding: 40px 30px 25px;
            border-top: 1px solid var(--border-light);
        }
        
        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 40px;
        }
        
        .footer-section {
            flex: 1;
            min-width: 150px;
        }
        
        .footer-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .footer-links {
            list-style: none;
        }
        
        .footer-links li {
            margin-bottom: 10px;
        }
        
        .footer-links a {
            text-decoration: none;
            color: var(--text-gray);
            font-size: 0.85rem;
            transition: color var(--transition-speed);
            display: inline-block;
            cursor: pointer;
        }
        
        .footer-links a:hover {
            color: var(--text-dark);
            text-decoration: underline;
            text-underline-offset: 4px;
        }
        
        .footer-social {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        
        .footer-social a {
            text-decoration: none;
            color: var(--text-gray);
            font-size: 1rem;
            transition: color var(--transition-speed);
        }
        
        .footer-social a:hover {
            color: var(--text-dark);
            text-decoration: underline;
            text-underline-offset: 4px;
        }
        
        .footer-bottom {
            max-width: 1200px;
            margin: 30px auto 0;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-gray);
        }
        
        .footer-bottom p {
            margin-bottom: 8px;
        }
        
        .footer-bottom a {
            color: var(--text-gray);
            text-decoration: none;
        }
        
        .footer-bottom a:hover {
            color: var(--text-dark);
            text-decoration: underline;
            text-underline-offset: 4px;
        }
        
        .thanks {
            font-size: 0.7rem;
            color: var(--text-gray);
            margin-top: 10px;
        }

        .tm-open-btn {
            margin-top: 22px;
            background-color: #007aff;
            color: white;
            border: none;
            padding: 12px 36px;
            border-radius: 40px;
            font-size: 1.05rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            font-family: inherit;
        }

        .tm-open-btn:hover {
            background-color: #0051d5;
        }

        .tm-open-btn:active {
            transform: scale(0.96);
        }

        .tm-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .tm-overlay.show {
            display: flex;
        }

        .tm-modal {
            background: var(--white);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            padding: 26px 30px 22px;
            width: 100%;
            max-width: 420px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .tm-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .tm-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .tm-close {
            background: var(--bg-gray);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1.2rem;
            color: var(--text-gray);
            cursor: pointer;
            line-height: 1;
        }

        .tm-close:hover {
            color: var(--text-dark);
        }

        .tm-cal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .tm-cal-head .tm-month-label {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .tm-nav-btn {
            background: var(--bg-gray);
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            font-size: 1.2rem;
            color: var(--text-dark);
            cursor: pointer;
        }

        .tm-nav-btn:disabled {
            opacity: 0.3;
            cursor: default;
        }

        .tm-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: repeat(6, 48px);
            gap: 4px;
        }

        .tm-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 4px;
        }

        .tm-weekday {
            text-align: center;
            font-size: 0.72rem;
            color: var(--text-gray);
            padding: 2px 0;
        }

        .tm-day {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 0.88rem;
            color: var(--text-dark);
            background: var(--bg-gray);
            cursor: pointer;
            transition: background-color 0.15s, transform 0.15s;
            border: none;
            font-family: inherit;
            padding: 0;
        }

        .tm-day:hover:not(:disabled) {
            background: #e0e6ef;
            transform: scale(1.06);
        }

        .tm-day:disabled {
            background: transparent;
            color: #c7c7cc;
            cursor: default;
        }

        .tm-day.birthday:disabled {
            background: #ffe3b3;
            color: #b26a00;
            cursor: default;
        }

        .tm-day.future-bd {
            cursor: default;
        }

        .tm-day.future-bd:hover {
            background: #ffe3b3;
            transform: none;
        }

        .tm-day.origin {
            background: #5856d6;
            color: white;
            font-weight: 600;
        }

        .tm-day.origin:hover:not(:disabled) {
            background: #4646c6;
        }

        .tm-egg-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 3000;
            background: #0b1026;
        }

        .tm-egg-overlay.show {
            display: block;
        }

        .tm-egg-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .tm-egg-close {
            position: absolute;
            top: 18px;
            right: 22px;
            background: rgba(255, 255, 255, 0.12);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.35rem;
            color: rgba(255, 255, 255, 0.85);
            cursor: pointer;
            line-height: 1;
        }

        .tm-egg-close:hover {
            background: rgba(255, 255, 255, 0.22);
        }

        .tm-egg-tip {
            position: absolute;
            bottom: 28px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.95rem;
            letter-spacing: 1px;
            pointer-events: none;
        }

        .tm-day.today {
            background: #007aff;
            color: white;
            font-weight: 600;
        }

        .tm-day.birthday {
            background: #ff9f0a;
            color: white;
            font-weight: 600;
        }

        .tm-day.birthday:hover:not(:disabled) {
            background: #e68a00;
        }

        .tm-day .tm-flag {
            font-size: 0.55rem;
            line-height: 1.2;
            margin-top: 1px;
        }

        .tm-hint {
            margin-top: 14px;
            text-align: center;
            font-size: 0.82rem;
            color: var(--text-gray);
            line-height: 1.5;
        }

        .tm-preview {
            background: var(--white);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 1100px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .tm-preview-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-light);
            gap: 12px;
        }

        .tm-preview-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .tm-preview-title small {
            display: block;
            font-weight: 400;
            color: var(--text-gray);
            font-size: 0.78rem;
            margin-top: 2px;
        }

        .tm-preview-actions {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }

        .tm-preview-actions a {
            color: #007aff;
            text-decoration: none;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .tm-preview-actions a:hover {
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .tm-preview-frame {
            flex: 1;
            width: 100%;
            border: none;
            background: var(--bg-gray);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes subtle-float {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-12px);
            }
            100% {
                transform: translateY(0px);
            }
        }
        
        @media (max-width: 734px) {
            .globalnav {
                height: 48px;
                padding: 0 20px;
            }
            
            .globalnav-logo {
                height: 48px;
            }
            
            .nav-logo {
                height: 48px;
            }
            
            .globalnav-links {
                height: 48px;
                gap: 18px;
            }
            
            .globalnav-link {
                font-size: 1rem;
                line-height: 48px;
            }
            
            .center-logo {
                max-width: 300px;
            }
            
            .greeting {
                font-size: 2.8rem;
                min-height: 65px;
            }
            
            .welcome-text {
                font-size: 1.7rem;
            }
            
            .notification {
                font-size: 1.2rem;
                padding: 12px 20px;
            }
            
            .main-content {
                min-height: calc(100vh - 48px);
            }
            
            .footer {
                padding: 30px 20px 20px;
            }
            
            .footer-content {
                flex-direction: column;
                gap: 25px;
            }
            
            .footer-section {
                text-align: center;
            }
            
            .footer-social {
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .globalnav {
                height: 48px;
                padding: 0 15px;
            }
            
            .globalnav-links {
                gap: 14px;
            }
            
            .globalnav-link {
                font-size: 0.95rem;
                line-height: 48px;
            }
            
            .center-logo {
                max-width: 250px;
            }
            
            .greeting {
                font-size: 2.2rem;
                min-height: 55px;
            }
            
            .welcome-text {
                font-size: 1.3rem;
            }
            
            .notification {
                font-size: 1rem;
                padding: 10px 18px;
                white-space: normal;
                text-align: center;
                min-width: 200px;
            }
            
            .main-content {
                min-height: calc(100vh - 48px);
            }
            
            .footer {
                padding: 25px 15px 15px;
            }
        }
    </style>
</head>
<body>
    <nav class="globalnav">
        <div class="globalnav-logo">
            <img src="photo/logo.png" alt="星星官网标志" class="nav-logo" loading="lazy">
        </div>
        <div class="globalnav-links">
            <a href="#" class="globalnav-link" id="home-link" aria-label="首页">首页</a>
            <a href="#" class="globalnav-link" id="about-link" aria-label="关于我们">关于我们</a>
            <a href="#" class="globalnav-link" id="service-link" aria-label="服务">服务</a>
            <a href="#" class="globalnav-link" id="contact-link" aria-label="联系我们">联系我们</a>
        </div>
    </nav>
    
    <div class="notification" id="notification" aria-live="polite">敬请期待</div>

    <div class="tm-overlay" id="tm-overlay">
        <div class="tm-modal" role="dialog" aria-label="时光机日历">
            <div class="tm-header">
                <span class="tm-title">时光机</span>
                <button class="tm-close" id="tm-close-btn" aria-label="关闭">×</button>
            </div>
            <div class="tm-cal-head">
                <button class="tm-nav-btn" id="tm-prev-btn" aria-label="上个月">‹</button>
                <span class="tm-month-label" id="tm-month-label"></span>
                <button class="tm-nav-btn" id="tm-next-btn" aria-label="下个月">›</button>
            </div>
            <div class="tm-weekdays" id="tm-weekdays">
                <span class="tm-weekday">一</span>
                <span class="tm-weekday">二</span>
                <span class="tm-weekday">三</span>
                <span class="tm-weekday">四</span>
                <span class="tm-weekday">五</span>
                <span class="tm-weekday">六</span>
                <span class="tm-weekday">日</span>
            </div>
            <div class="tm-grid" id="tm-grid"></div>
            <p class="tm-hint" id="tm-hint"></p>
        </div>
    </div>

    <div class="tm-overlay" id="tm-preview-overlay">
        <div class="tm-preview" role="dialog" aria-label="历史版本预览">
            <div class="tm-preview-head">
                <div class="tm-preview-title" id="tm-preview-title"></div>
                <div class="tm-preview-actions">
                    <a href="#" id="tm-preview-newtab" target="_blank" rel="noopener">在新窗口打开</a>
                    <button class="tm-close" id="tm-preview-close" aria-label="关闭预览">×</button>
                </div>
            </div>
            <iframe class="tm-preview-frame" id="tm-preview-frame" title="历史版本预览"></iframe>
        </div>
    </div>

    <div class="tm-egg-overlay" id="tm-egg-overlay">
        <canvas class="tm-egg-canvas" id="tm-egg-canvas"></canvas>
        <button class="tm-egg-close" id="tm-egg-close" aria-label="关闭">×</button>
        <div class="tm-egg-tip" id="tm-egg-tip"></div>
    </div>
    
    <main class="main-content">
        <img src="photo/logo.png" alt="星星官网中心标志" class="center-logo" loading="lazy">
        
        <div class="greeting" id="greeting" aria-label="动态问候语">
            <!-- 问候语动态插入 -->
        </div>
        
        <p class="welcome-text">感恩相伴 与你同行</p>

        <button class="tm-open-btn" id="tm-open-btn">时光机</button>
    </main>
    
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-section">
                <h3 class="footer-title">探索</h3>
                <ul class="footer-links">
                    <li><a href="#" class="footer-link" id="footer-home-link">首页</a></li>
                    <li><a href="#" class="footer-link" id="footer-about-link">关于我们</a></li>
                    <li><a href="#" class="footer-link" id="footer-service-link">服务</a></li>
                    <li><a href="#" class="footer-link" id="footer-contact-link">联系我们</a></li>
                </ul>
            </div>
            
            <div class="footer-section">
                <h3 class="footer-title">关注我们</h3>
                <div class="footer-social">
                    <a href="#" id="douyin-link" target="_blank" rel="noopener noreferrer" aria-label="抖音">抖音</a>
                    <a href="#" id="github-link" target="_blank" rel="noopener noreferrer" aria-label="GitHub">GitHub</a>
                </div>
            </div>
        </div>
        
        <div class="footer-bottom">
            <p>&copy; 2026 星星官网. 保留所有权利。</p>
            <div class=" ">
            </div>
        </div>
    </footer>

    <script>
        (function() {
            const greetings = [
                "生日快乐",
                "Happy Birthday",
                "Feliz Cumpleaños",
                "Joyeux Anniversaire",
                "Alles Gute zum Geburtstag",
                "Buon Compleanno",
                "お誕生日おめでとう",
                "생일 축하합니다",
                "С Днём Рождения",
                "สุขสันต์วันเกิด"
            ];
            
            let currentGreetingIndex = 0;
            const greetingElement = document.getElementById('greeting');
            const notification = document.getElementById('notification');

            function updateGreeting() {
                if (!greetingElement) return;
                
                const newSpan = document.createElement('span');
                newSpan.textContent = greetings[currentGreetingIndex];
                newSpan.style.animation = 'none';
                
                greetingElement.innerHTML = '';
                greetingElement.appendChild(newSpan);
                

                setTimeout(() => {
                    newSpan.style.animation = '';
                }, 10);
                
                currentGreetingIndex = (currentGreetingIndex + 1) % greetings.length;
            }
            
            function showNotification() {
                if (!notification) return;
                
                notification.classList.add('show');
                
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 1500);
            }
            
            function scrollToTop() {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
            
            function scrollToFooter() {
                const footer = document.querySelector('.footer');
                if (footer) {
                    footer.scrollIntoView({ behavior: 'smooth' });
                }
            }
           
            function goToService() {
                window.location.href = './serve/index.html';
            }
            
            const douyinUrl = 'https://www.douyin.com/user/MS4wLjABAAAASkP1rl3lePnPAJcRz-M6INTL8-ZDWvJEXXUiWe1KAlXclwL1qcGjjyotx4NvjLCf?from_tab_name=main';

            // ===== 时光机 =====
            // 每个历史版本：start = 该版本上线日（也是文件夹名），从 start 到下一版本 start 前一天都归它管
            const TM_VERSIONS = [
                { start: '2025-10-03', path: 'star25-10-03/', label: '梦开始的地方' },
                { start: '2025-10-05', path: 'star25-10-05/', label: '星星官网诞生日版本' },
                { start: '2025-10-06', path: 'star25-10-06/', label: '诞生次日起的版本' },
                { start: '2026-02-18', path: 'star26-02-18/', label: '2026 春季改版' },
                { start: '2026-04-06', path: 'star26-04-06/', label: '2026 春季版本（快照）' },
                { start: '2026-10-02', path: './', label: '当前版本（生日版）' }
            ];
            const TM_SITE_START = '2025-10-03';
            const TM_BIRTHDAY_MMDD = '10-05';

            const tmOverlay = document.getElementById('tm-overlay');
            const tmPreviewOverlay = document.getElementById('tm-preview-overlay');
            const tmGrid = document.getElementById('tm-grid');
            const tmMonthLabel = document.getElementById('tm-month-label');
            const tmHint = document.getElementById('tm-hint');
            let tmViewYear = 0;
            let tmViewMonth = 0; // 0-11

            function tmPad(n) { return String(n).padStart(2, '0'); }
            function tmFmt(y, m, d) { return y + '-' + tmPad(m + 1) + '-' + tmPad(d); }
            function tmToday() {
                const t = new Date();
                return tmFmt(t.getFullYear(), t.getMonth(), t.getDate());
            }
            function tmVersionFor(dateStr) {
                let found = null;
                for (const v of TM_VERSIONS) {
                    if (dateStr >= v.start) found = v;
                }
                return found;
            }
            function tmIsBirthday(y, m, d) {
                return tmFmt(y, m, d).slice(5) === TM_BIRTHDAY_MMDD;
            }

            function tmOpen() {
                const t = new Date();
                tmViewYear = t.getFullYear();
                tmViewMonth = t.getMonth();
                tmOverlay.classList.add('show');
                tmRender();
            }
            function tmCloseAll() {
                tmOverlay.classList.remove('show');
                tmPreviewOverlay.classList.remove('show');
                document.getElementById('tm-preview-frame').src = 'about:blank';
            }

            function tmRender() {
                tmMonthLabel.textContent = tmViewYear + ' 年 ' + (tmViewMonth + 1) + ' 月';
                const first = new Date(tmViewYear, tmViewMonth, 1);
                const daysInMonth = new Date(tmViewYear, tmViewMonth + 1, 0).getDate();
                const offset = (first.getDay() + 6) % 7; // 周一开头
                const todayStr = tmToday();
                const minMonthOk = tmViewYear > 2025 || (tmViewYear === 2025 && tmViewMonth >= 9);
                const now = new Date();
                const maxMonthOk = tmViewYear < now.getFullYear() ||
                    (tmViewYear === now.getFullYear() && tmViewMonth <= now.getMonth());
                document.getElementById('tm-prev-btn').disabled = !minMonthOk;
                document.getElementById('tm-next-btn').disabled = !maxMonthOk;

                tmGrid.innerHTML = '';
                for (let i = 0; i < offset; i++) {
                    tmGrid.appendChild(document.createElement('span'));
                }
                let birthdayInMonth = false;
                function tmAddFlag(btn, text) {
                    const f = document.createElement('span');
                    f.className = 'tm-flag';
                    f.textContent = text;
                    btn.appendChild(f);
                }
                for (let d = 1; d <= daysInMonth; d++) {
                    const dateStr = tmFmt(tmViewYear, tmViewMonth, d);
                    const isBd = tmIsBirthday(tmViewYear, tmViewMonth, d);
                    const isOrigin = dateStr === '2025-10-03';
                    const isFuture = dateStr > todayStr;
                    const btn = document.createElement('button');
                    btn.className = 'tm-day';
                    btn.textContent = d;
                    if (isBd) {
                        birthdayInMonth = true;
                        btn.classList.add('birthday');
                        tmAddFlag(btn, '生日');
                    }
                    if (isOrigin) {
                        btn.classList.add('origin');
                        tmAddFlag(btn, '梦开始');
                    }
                    const beforeSite = dateStr < TM_SITE_START;
                    if (beforeSite || (isFuture && !isBd)) {
                        btn.disabled = true;
                    }
                    if (isFuture && isBd) {
                        btn.classList.add('future-bd');
                        btn.title = '还没到哦：星星官网生日（10月5日）';
                    } else {
                        if (dateStr === todayStr) btn.classList.add('today');
                        if (isOrigin) btn.title = '梦开始的地方';
                        const v = tmVersionFor(dateStr);
                        btn.title = (btn.title ? btn.title + ' · ' : '') + '当天版本：' + (v ? v.label : '未知');
                        btn.addEventListener('click', () => tmOpenPreview(dateStr, v));
                    }
                    if (isBd) btn.addEventListener('click', tmEggClick);
                    tmGrid.appendChild(btn);
                }
                // 固定补满 6 行（42 格），保证每月日历高度一致、翻月箭头不跳动
                const usedCells = offset + daysInMonth;
                for (let i = usedCells; i < 42; i++) {
                    tmGrid.appendChild(document.createElement('span'));
                }

                // 生日提示：本月没有生日格时，显示距下次生日的倒计时
                if (!birthdayInMonth) {
                    const now = new Date();
                    let nextBd = new Date(now.getFullYear(), 9, 5);
                    if (tmFmt(now.getFullYear(), now.getMonth(), now.getDate()).slice(5) > TM_BIRTHDAY_MMDD) {
                        nextBd = new Date(now.getFullYear() + 1, 9, 5);
                    }
                    const days = Math.ceil((nextBd - now) / 86400000);
                    if (days > 0 && days <= 62) {
                        tmHint.textContent = '🎂 距离星星官网生日（' + nextBd.getFullYear() + '-10-05）还有 ' + days + ' 天';
                    } else {
                        tmHint.textContent = '';
                    }
                } else {
                    tmHint.textContent = '点击日期，看看那天的星星官网长什么样';
                }
            }

            function tmOpenPreview(dateStr, v) {
                const frame = document.getElementById('tm-preview-frame');

            const tmOpenBtn = document.getElementById('tm-open-btn');
            if (tmOpenBtn) tmOpenBtn.addEventListener('click', tmOpen);

            if (tmOverlay) tmOverlay.addEventListener('click', (e) => { if (e.target === tmOverlay) tmCloseAll(); });
            if (tmPreviewOverlay) tmPreviewOverlay.addEventListener('click', (e) => { if (e.target === tmPreviewOverlay) tmCloseAll(); });
            document.getElementById('tm-prev-btn').addEventListener('click', () => {
                tmViewMonth--;
                if (tmViewMonth < 0) { tmViewMonth = 11; tmViewYear--; }
                tmRender();
            });
            document.getElementById('tm-next-btn').addEventListener('click', () => {
                tmViewMonth++;

            });

            // ===== 生日彩蛋：2 秒内连点 2026-10-05 生日格 5 次（双击也会累计） =====
            let eggCount = 0;
            let eggCountTimer = null;
            let eggRaf = null;
            let eggHintBackup = '';

            function tmEggClick() {
                eggCount++;
                if (eggCount === 1) eggHintBackup = tmHint.textContent;
                clearTimeout(eggCountTimer);
                eggCountTimer = setTimeout(() => {
                    eggCount = 0;
                    tmHint.textContent = eggHintBackup;
                }, 2200);
                if (eggCount >= 5) {
                    eggCount = 0;
                    startBirthdayEgg();
                    return;
                }
                if (eggCount >= 2) {
                    tmHint.textContent = '🎂 悄悄告诉你：再连点 ' + (5 - eggCount) + ' 次生日格有惊喜…';
                }
            }

            function startBirthdayEgg() {
                tmOverlay.classList.remove('show');
                tmPreviewOverlay.classList.remove('show');
                document.getElementById('tm-preview-frame').src = 'about:blank';

                const ov = document.getElementById('tm-egg-overlay');
                ov.classList.add('show');
                const cv = document.getElementById('tm-egg-canvas');
                const ctx = cv.getContext('2d');
                const tip = document.getElementById('tm-egg-tip');

                let W, H;
                function resize() {
                    W = cv.width = window.innerWidth;
                    H = cv.height = window.innerHeight;
                }
                resize();
                window.addEventListener('resize', resize);

                const rainbow = ['#ff3b30', '#ff9500', '#ffcc00', '#34c759', '#32ade6', '#5856d6', '#af52de'];

                // 背景星空
                const bgStars = [];
                for (let i = 0; i < 130; i++) {
                    bgStars.push({ x: Math.random(), y: Math.random() * 0.8, r: Math.random() * 1.4 + 0.4, tw: Math.random() * Math.PI * 2 });
                }

                // 升空对象：蛋糕 + 7 只彩虹气球（到顶部被"天花板"拦住）
                const risers = [{ kind: 'cake', x: 0.5, hx: 0.5, ty: 0.32, s: 88, hold: 0, sway: 0 }];
                for (let i = 0; i < 7; i++) {
                    const hx = 0.08 + 0.84 * i / 6 + (Math.random() * 0.05 - 0.025);
                    risers.push({
                        kind: 'balloon', color: rainbow[i],
                        x: hx, hx: hx,
                        ty: 0.10 + 0.05 * (i % 4),
                        s: 44 + Math.random() * 14,
                        hold: i * 90 + Math.random() * 120,
                        sway: Math.random() * Math.PI * 2,
                        y: 1.3
                    });
                }

                const RISE_MS = 2800;
                const startT = performance.now();
                let phase = 'rise'; // rise -> play -> firework
                let fireworkAt = Infinity;

                function drawBalloon(x, y, r, color) {
                    ctx.save();
                    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    ctx.moveTo(x, y + r * 1.25);
                    ctx.quadraticCurveTo(x + 8, y + r * 1.75, x, y + r * 2.25);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.ellipse(x, y, r * 0.78, r, 0, 0, Math.PI * 2);
                    const bg = ctx.createRadialGradient(x - r * 0.25, y - r * 0.35, r * 0.1, x, y, r);
                    bg.addColorStop(0, 'rgba(255,255,255,0.9)');
                    bg.addColorStop(0.3, color);
                    bg.addColorStop(1, color);
                    ctx.fillStyle = bg;
                    ctx.shadowColor = color;
                    ctx.shadowBlur = 14;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(255,255,255,0.35)';
                    ctx.beginPath();
                    ctx.ellipse(x - r * 0.28, y - r * 0.4, r * 0.16, r * 0.24, -0.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(x, y + r * 0.98);
                    ctx.lineTo(x - 5, y + r * 1.22);
                    ctx.lineTo(x + 5, y + r * 1.22);
                    ctx.closePath();
                    ctx.fillStyle = color;
                    ctx.fill();
                    ctx.restore();
                }

                // 拖拽（向上拖有阻力）
                let dragObj = null, lastX = 0, lastY = 0;
                function toLocal(e) {
                    const r = cv.getBoundingClientRect();
                    return { x: e.clientX - r.left, y: e.clientY - r.top };
                }
                function pick(px, py) {
                    let best = null, bd = 1e9;
                    for (const o of risers) {
                        const d = Math.hypot(px - o.x * W, py - o.y * H);
                        if (d < o.s * 1.5 && d < bd) { bd = d; best = o; }
                    }
                    return best;
                }
                function onDown(e) {
                    const p = toLocal(e);
                    const o = pick(p.x, p.y);
                    if (o) {
                        dragObj = o;
                        o.grabbed = true;
                        lastX = p.x; lastY = p.y;
                        cv.style.cursor = 'grabbing';
                    }
                }
                function onMove(e) {
                    if (!dragObj) return;
                    const p = toLocal(e);
                    let dx = p.x - lastX;
                    let dy = p.y - lastY;
                    if (dy > 0) dy *= 0.32; // 向下拖动时对抗浮力的阻力感
                    dragObj.x = Math.min(0.97, Math.max(0.03, dragObj.x + dx / W));
                    dragObj.y = Math.min(0.92, Math.max(0.05, dragObj.y + dy / H));
                    lastX = p.x; lastY = p.y;
                    if (fireworkAt === Infinity) fireworkAt = performance.now() + 1800;
                }
                function onUp() {
                    if (dragObj) { dragObj.grabbed = false; dragObj = null; cv.style.cursor = 'grab'; }
                }
                cv.addEventListener('pointerdown', onDown);
                window.addEventListener('pointermove', onMove);
                window.addEventListener('pointerup', onUp);

                // 烟花文字“生日快乐”：把文字采样成粒子目标点
                let textParts = null;
                function buildText() {
                    const off = document.createElement('canvas');
                    off.width = 640; off.height = 200;
                    const c = off.getContext('2d');
                    c.font = 'bold 150px "PingFang SC", "Microsoft YaHei", sans-serif';
                    c.textAlign = 'center';
                    c.textBaseline = 'middle';
                    c.fillStyle = '#fff';
                    c.fillText('生日快乐', 320, 105);
                    const data = c.getImageData(0, 0, 640, 200).data;
                    const pts = [];
                    for (let y = 0; y < 200; y += 5) {
                        for (let x = 0; x < 640; x += 5) {
                            if (data[(y * 640 + x) * 4 + 3] > 120) pts.push([x / 640, y / 200]);
                        }
                    }
                    const tw = Math.min(W * 0.86, 760), th = tw * 200 / 640;
                    const cx = W / 2, cyc = H * 0.52;
                    const born = performance.now();
                    textParts = pts.map(pt => {
                        const ang = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 6;
                        return {
                            x: cx, y: cyc,
                            vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
                            tx: cx + (pt[0] - 0.5) * tw, ty: cyc + (pt[1] - 0.5) * th,
                            hue: Math.floor(310 * pt[0]),
                            lock: false, tw: Math.random() * Math.PI * 2, born: born
                        };
                    });
                }

                // 星形烟花
                let starBursts = [];
                function spawnStarBurst(x, y, big) {
                    const hue = Math.floor(Math.random() * 360);
                    const n = big ? 70 : 42;
                    for (let i = 0; i < n; i++) {
                        const ang = (i / n) * Math.PI * 2 + Math.random() * 0.2;
                        const sp = (big ? 5 : 3) + Math.random() * 2.5;
                        starBursts.push({
                            x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
                            r: (big ? 7 : 5) + Math.random() * 3,
                            rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.2,
                            life: 1, hue: (hue + i * 6) % 360
                        });
                    }
                }

                function drawStar(x, y, r, rot, hue, life, glow) {
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate(rot);
                    ctx.beginPath();
                    for (let i = 0; i < 10; i++) {
                        const rad = i % 2 === 0 ? r : r * 0.45;
                        const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
                        const px = Math.cos(a) * rad, py = Math.sin(a) * rad;
                        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.fillStyle = 'hsla(' + hue + ', 95%, ' + (60 + 15 * Math.sin(life * 10)) + '%,' + life + ')';
                    if (glow !== 0) {
                        ctx.shadowColor = 'hsl(' + hue + ',95%,65%)';
                        ctx.shadowBlur = glow === undefined ? 8 : glow;
                    }
                    ctx.fill();
                    ctx.restore();
                }

                let lastBurst = 0;
                let bigDone = false;
                cv.addEventListener('click', (e) => {
                    if (phase === 'firework') {
                        const p = toLocal(e);
                        spawnStarBurst(p.x, p.y, false);
                    }
                });

                function frame(now) {
                    if (!ov.classList.contains('show')) return;
                    const t = now - startT;

                    // 夜空背景 + 星星
                    const g = ctx.createLinearGradient(0, 0, 0, H);
                    g.addColorStop(0, '#0b1026');
                    g.addColorStop(0.6, '#1a1440');
                    g.addColorStop(1, '#2a1a4a');
                    ctx.fillStyle = g;
                    ctx.fillRect(0, 0, W, H);
                    for (const s of bgStars) {
                        const a = 0.35 + 0.35 * Math.sin(now / 700 + s.tw);
                        ctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
                        ctx.beginPath();
                        ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    if (phase === 'rise') {
                        tip.textContent = '🎂 梦想起飞……';
                        if (t > RISE_MS) {
                            phase = 'play';
                            fireworkAt = now + 2600;
                            tip.textContent = '拖动蛋糕和气球玩一玩吧 ✋';
                            cv.style.cursor = 'grab';
                        }
                    }

                    // 蛋糕与气球：浮力回位 + 相互碰撞摊开
                    if (phase === 'rise') {
                        for (const o of risers) {
                            const k = Math.min(1, Math.max(0, (t - o.hold) / (RISE_MS - 600)));
                            const e = 1 - Math.pow(1 - k, 3);
                            o.y = 1.25 + (o.ty - 1.25) * e;
                        }
                    } else {
                        for (const o of risers) {
                            if (!o.grabbed) {
                                o.y += (o.ty - o.y) * 0.035;      // 松手后缓缓浮回被拦住的位置
                                o.x += (o.hx - o.x) * 0.012;      // 横向也慢慢漂回自己的位置
                            }
                        }
                        // 两两碰撞：重叠就沿连线推开（被抓住的不动）
                        for (let i = 0; i < risers.length; i++) {
                            for (let j = i + 1; j < risers.length; j++) {
                                const a = risers[i], b = risers[j];
                                const ra = a.s * 0.85, rb = b.s * 0.85;
                                const dx = (b.x - a.x) * W, dy = (b.y - a.y) * H;
                                const d = Math.hypot(dx, dy);
                                const min = (ra + rb) * 0.9;
                                if (d > 0.001 && d < min) {
                                    const push = (min - d) / d * 0.5;
                                    if (!a.grabbed) { a.x -= dx * push / W; a.y -= dy * push / H; }
                                    if (!b.grabbed) { b.x += dx * push / W; b.y += dy * push / H; }
                                }
                            }
                        }
                    }
                    for (const o of risers) {
                        const px = o.x * W + (phase !== 'rise' && !o.grabbed ? Math.sin(now / 900 + o.sway) * 6 : 0);
                        const py = o.y * H;
                        if (o.kind === 'cake') {
                            ctx.font = o.s + 'px serif';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText('🎂', px, py);
                        } else {
                            drawBalloon(px, py, o.s, o.color);
                        }
                    }

                    // 烟花阶段
                    if (phase === 'play' && now >= fireworkAt) {
                        phase = 'firework';
                        buildText();
                        tip.textContent = '🎉 生日快乐！点击夜空再放一朵星星烟花';
                    }
                    if (phase === 'firework') {
                        if (now - lastBurst > 850) {
                            lastBurst = now;
                            spawnStarBurst(W * (0.15 + Math.random() * 0.7), H * (0.12 + Math.random() * 0.3), false);
                        }
                        if (!bigDone && textParts.every(p => p.lock)) {
                            bigDone = true;
                            spawnStarBurst(W / 2, H * 0.52, true);
                        }
                        for (const p of textParts) {
                            if (!p.lock) {
                                if (now - p.born < 420) {
                                    p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.vx *= 0.985;
                                } else {
                                    p.vx += (p.tx - p.x) * 0.055;
                                    p.vy += (p.ty - p.y) * 0.055;
                                    p.vx *= 0.85; p.vy *= 0.85;
                                    p.x += p.vx; p.y += p.vy;
                                    if (Math.hypot(p.tx - p.x, p.ty - p.y) < 3) p.lock = true;
                                }
                            }
                            const a = p.lock ? 0.75 + 0.25 * Math.sin(now / 130 + p.tw) : 0.95;
                            drawStar(p.x, p.y, 3.2, now / 2400 + p.tw, p.hue, a, 3);
                        }
                        ctx.shadowBlur = 0;
                        starBursts = starBursts.filter(s => s.life > 0.02);
                        for (const s of starBursts) {
                            s.x += s.vx; s.y += s.vy; s.vy += 0.045; s.vx *= 0.985;
                            s.rot += s.vr; s.life -= 0.011;
                            drawStar(s.x, s.y, s.r, s.rot, s.hue, Math.max(0, s.life));
                        }
                    }

                    eggRaf = requestAnimationFrame(frame);
                }
                eggRaf = requestAnimationFrame(frame);

                function closeEgg() {
                    ov.classList.remove('show');
                    if (eggRaf) cancelAnimationFrame(eggRaf);
                    window.removeEventListener('resize', resize);
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onUp);
                }
                document.getElementById('tm-egg-close').addEventListener('click', closeEgg);
            }

            updateGreeting();
            setInterval(updateGreeting, 3000);
        })();
    </script>
</body>
