<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="星星官网 - 专业、创新的服务体验">
    <title>星星官网 - 应用详情</title>
    <style>
        :root {
            --text-dark: #1d1d1f;
            --text-gray: #6e6e73;
            --text-light: #666;
            --border-light: #d2d2d6;
            --bg-gray: #f5f5f7;
            --nav-bg: #ffffff;
            --white: #fff;
            --footer-bg: #f5f5f7;
            --transition-speed: 0.3s;
            --nav-link-size: 1.1rem;
            --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --btn-blue: #007aff;
            --btn-blue-hover: #0051d5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: var(--bg-gray);
        }

        .globalnav {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            border-bottom: 1px solid var(--border-light);
            background-color: var(--nav-bg);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .globalnav-logo {
            height: 44px;
            display: flex;
            align-items: center;
        }

        .nav-logo {
            height: 44px;
            width: auto;
            display: block;
        }

        .globalnav-links {
            display: flex;
            gap: 25px;
            height: 44px;
            align-items: center;
        }

        .globalnav-link {
            text-decoration: none;
            color: var(--text-gray);
            font-size: var(--nav-link-size);
            transition: color var(--transition-speed);
            padding: 0;
            cursor: pointer;
            border-radius: 4px;
            line-height: 44px;
            display: inline-block;
        }

        .globalnav-link:hover {
            color: var(--text-dark);
        }

        .main-content {
            flex: 1;
            padding: 50px 40px 60px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .detail-wrap {
            max-width: 760px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .back-link {
            color: var(--btn-blue);
            text-decoration: none;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            width: fit-content;
        }

        .back-link:hover {
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .app-head {
            background: var(--white);
            border-radius: 24px;
            box-shadow: var(--card-shadow);
            padding: 32px;
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .app-icon {
            flex-shrink: 0;
            width: 128px;
            height: 128px;
            border-radius: 26px;
            overflow: hidden;
            background: var(--bg-gray);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
        }

        .app-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .app-head-info {
            flex: 1;
            min-width: 0;
        }

        .app-name {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .app-description {
            font-size: 1rem;
            color: var(--text-gray);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .profile-card {
            background: var(--white);
            border-radius: 24px;
            box-shadow: var(--card-shadow);
            padding: 32px 36px;
        }

        .profile-card .loading,
        .profile-card .error {
            color: var(--text-gray);
            font-size: 0.95rem;
            padding: 10px 0;
        }

        .profile-card .error {
            color: #c0392b;
        }

        .markdown-body {
            color: var(--text-dark);
            font-size: 1rem;
            line-height: 1.75;
        }

        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3 {
            margin: 20px 0 10px;
            line-height: 1.3;
        }

        .markdown-body h1:first-child,
        .markdown-body h2:first-child,
        .markdown-body h3:first-child {
            margin-top: 0;
        }

        .markdown-body h1 {
            font-size: 1.5rem;
        }

        .markdown-body h2 {
            font-size: 1.2rem;
        }

        .markdown-body h3 {
            font-size: 1.05rem;
        }

        .markdown-body p,
        .markdown-body ul,
        .markdown-body ol {
            margin-bottom: 12px;
        }

        .markdown-body ul,
        .markdown-body ol {
            padding-left: 24px;
        }

        .markdown-body code {
            background: var(--bg-gray);
            border-radius: 4px;
            padding: 2px 6px;
            font-family: 'SF Mono', Menlo, Consolas, monospace;
            font-size: 0.85em;
        }

        .markdown-body pre {
            background: var(--bg-gray);
            border-radius: 12px;
            padding: 14px 16px;
            overflow-x: auto;
            margin-bottom: 12px;
        }

        .markdown-body pre code {
            background: none;
            padding: 0;
        }

        .markdown-body blockquote {
            border-left: 3px solid var(--border-light);
            padding-left: 14px;
            color: var(--text-gray);
            margin-bottom: 12px;
        }

        .markdown-body a {
            color: var(--btn-blue);
        }

        .markdown-body img {
            max-width: 100%;
        }

        .markdown-body hr {
            border: none;
            border-top: 1px solid var(--border-light);
            margin: 16px 0;
        }

        .not-found {
            text-align: center;
            color: var(--text-gray);
            padding: 60px 0;
        }

        .not-found h1 {
            font-size: 1.5rem;
            color: var(--text-dark);
            margin-bottom: 12px;
        }

        .download-btn {
            flex-shrink: 0;
            background-color: var(--btn-blue);
            color: white;
            border: none;
            padding: 12px 40px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            white-space: nowrap;
        }

        .download-btn:hover {
            background-color: var(--btn-blue-hover);
        }

        .download-btn:active {
            transform: scale(0.96);
        }

        .footer {
            background-color: var(--footer-bg);
            padding: 40px 30px 25px;
            border-top: 1px solid var(--border-light);
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 40px;
        }

        .footer-section {
            flex: 1;
            min-width: 150px;
        }

        .footer-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .footer-links {
            list-style: none;
        }

        .footer-links li {
            margin-bottom: 10px;
        }

        .footer-links a {
            text-decoration: none;
            color: var(--text-gray);
            font-size: 0.85rem;
            transition: color var(--transition-speed);
            display: inline-block;
            cursor: pointer;
        }

        .footer-links a:hover {
            color: var(--text-dark);
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .footer-social {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .footer-social a {
            text-decoration: none;
            color: var(--text-gray);
            font-size: 1rem;
            transition: color var(--transition-speed);
        }

        .footer-social a:hover {
            color: var(--text-dark);
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .footer-bottom {
            max-width: 1200px;
            margin: 30px auto 0;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-gray);
        }

        .footer-bottom p {
            margin-bottom: 8px;
        }

        .thanks {
            font-size: 0.7rem;
            color: var(--text-gray);
            margin-top: 10px;
        }

        @media (max-width: 734px) {
            .globalnav {
                height: 48px;
                padding: 0 20px;
            }

            .globalnav-logo {
                height: 48px;
            }

            .nav-logo {
                height: 48px;
            }

            .globalnav-links {
                height: 48px;
                gap: 18px;
            }

            .globalnav-link {
                font-size: 1rem;
                line-height: 48px;
            }

            .main-content {
                padding: 30px 20px 40px;
            }

            .app-head {
                flex-direction: column;
                text-align: center;
                padding: 26px 20px;
            }

            .app-icon {
                width: 100px;
                height: 100px;
            }

            .app-name {
                font-size: 1.5rem;
            }

            .profile-card {
                padding: 24px 20px;
            }

            .footer {
                padding: 30px 20px 20px;
            }

            .footer-content {
                flex-direction: column;
                gap: 25px;
            }

            .footer-section {
                text-align: center;
            }

            .footer-social {
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .globalnav {
                height: 48px;
                padding: 0 15px;
            }

            .globalnav-links {
                gap: 14px;
            }

            .globalnav-link {
                font-size: 0.95rem;
                line-height: 48px;
            }

            .main-content {
                padding: 24px 15px 32px;
            }

            .app-name {
                font-size: 1.3rem;
            }

            .app-description {
                font-size: 0.9rem;
            }

            .profile-card {
                padding: 20px 16px;
            }

            .footer {
                padding: 25px 15px 15px;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <script src="config.js"></script>
</head>
<body>
    <nav class="globalnav">
        <div class="globalnav-logo">
            <img src="photo/logo.png" alt="星星官网标志" class="nav-logo" loading="lazy">
        </div>
        <div class="globalnav-links">
            <a href="../index.html" class="globalnav-link" id="home-link" aria-label="首页">首页</a>
            <a href="#" class="globalnav-link" id="about-link" aria-label="关于我们">关于我们</a>
            <a href="index.html" class="globalnav-link" id="service-link" aria-label="服务">服务</a>
            <a href="#" class="globalnav-link" id="contact-link" aria-label="联系我们">联系我们</a>
        </div>
    </nav>

    <main class="main-content">
        <div class="detail-wrap">
            <a href="index.html" class="back-link">&lsaquo; 返回服务列表</a>
            <div id="detail-root">
                <div class="not-found">正在加载…</div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-section">
                <h3 class="footer-title">探索</h3>
                <ul class="footer-links">
                    <li><a href="../index.html" class="footer-link">首页</a></li>
                    <li><a href="#" class="footer-link" id="footer-about-link">关于我们</a></li>
                    <li><a href="index.html" class="footer-link" id="footer-service-link">服务</a></li>
                    <li><a href="#" class="footer-link" id="footer-contact-link">联系我们</a></li>
                </ul>
            </div>

            <div class="footer-section">
                <h3 class="footer-title">关注我们</h3>
                <div class="footer-social">
                    <a href="#" id="douyin-link" target="_blank" rel="noopener noreferrer" aria-label="抖音">抖音</a>
                    <a href="#" id="github-link" target="_blank" rel="noopener noreferrer" aria-label="GitHub">GitHub</a>
                </div>
            </div>
        </div>

        <div class="footer-bottom">
            <p>&copy; 2026 星星官网. 保留所有权利。</p>
            <div class="  ">
            </div>
        </div>
    </footer>

    <script>
        (function() {
            const SETUP_DIR = './setup/';
            const PHOTO_DIR = './photo/';
            const PROFILE_DIR = './profile/';

            // 介绍文件：profile/<名字>.js（内容是 Markdown 文本），通过 script 标签加载，
            // 这样双击打开（file://）也能正常显示，不依赖 fetch。
            function loadProfileScript(profileName, cb) {
                if (window.STAR_PROFILES && window.STAR_PROFILES[profileName]) {
                    cb(window.STAR_PROFILES[profileName]);
                    return;
                }
                const s = document.createElement('script');
                s.src = PROFILE_DIR + encodeURIComponent(profileName) + '.js';
                s.onload = () => cb(window.STAR_PROFILES ? window.STAR_PROFILES[profileName] : undefined);
                s.onerror = () => cb(undefined);
                document.head.appendChild(s);
            }

            const detailRoot = document.getElementById('detail-root');

            function scrollToFooter() {
                const footer = document.querySelector('.footer');
                if (footer) {
                    footer.scrollIntoView({ behavior: 'smooth' });
                }
            }

            function scrollToTop() {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            function downloadFile(filename) {
                const link = document.createElement('a');
                link.href = SETUP_DIR + encodeURIComponent(filename);
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

            // 把 Markdown 渲染成 HTML；marked 加载失败时退化为等宽纯文本
            function renderMarkdown(md) {
                if (window.marked && typeof marked.parse === 'function') {
                    const div = document.createElement('div');
                    div.className = 'markdown-body';
                    div.innerHTML = marked.parse(md);
                    div.querySelectorAll('script, iframe, object, embed, style').forEach(el => el.remove());
                    div.querySelectorAll('*').forEach(el => {
                        [...el.attributes].forEach(attr => {
                            if (/^on/i.test(attr.name)) el.removeAttribute(attr.name);
                        });
                    });
                    return div;
                }
                const pre = document.createElement('pre');
                pre.className = 'markdown-body';
                pre.style.whiteSpace = 'pre-wrap';
                pre.textContent = md;
                return pre;
            }

            // config.js 的 STAR_APPS：每 5 行一个软件
            // 1 名称  2 简介  3 安装包文件名(setup/)  4 图片文件名(photo/)  5 介绍文件名(profile/)
            function parseConfig(text) {
                const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l !== '');
                const items = [];
                for (let i = 0; i + 4 < lines.length; i += 5) {
                    items.push({
                        name: lines[i],
                        description: lines[i + 1],
                        file: lines[i + 2],
                        image: lines[i + 3],
                        profile: lines[i + 4]
                    });
                }
                return items;
            }

            function buildPage(item) {
                document.title = '星星官网 - ' + item.name;
                detailRoot.innerHTML = '';

                const head = document.createElement('div');
                head.className = 'app-head';

                const icon = document.createElement('div');
                icon.className = 'app-icon';
                const img = document.createElement('img');
                img.src = PHOTO_DIR + encodeURIComponent(item.image);
                img.alt = item.name;
                img.onerror = () => { img.src = 'https://placehold.co/128x128/f0f0f0/666?text=' + encodeURIComponent(item.name); };
                icon.appendChild(img);

                const info = document.createElement('div');
                info.className = 'app-head-info';
                const name = document.createElement('h1');
                name.className = 'app-name';
                name.textContent = item.name;
                const desc = document.createElement('p');
                desc.className = 'app-description';
                desc.textContent = item.description;
                const btn = document.createElement('button');
                btn.className = 'download-btn';
                btn.textContent = '下载 ' + item.file;
                btn.addEventListener('click', () => downloadFile(item.file));
                info.appendChild(name);
                info.appendChild(desc);
                info.appendChild(btn);

                head.appendChild(icon);
                head.appendChild(info);

                const profileCard = document.createElement('div');
                profileCard.className = 'profile-card';
                profileCard.innerHTML = '<div class="loading">正在加载介绍…</div>';

                detailRoot.appendChild(head);
                detailRoot.appendChild(profileCard);

                loadProfile(item.profile, profileCard);
            }

            function loadProfile(profileName, profileCard) {
                loadProfileScript(profileName, (md) => {
                    if (typeof md === 'string') {
                        profileCard.innerHTML = '';
                        profileCard.appendChild(renderMarkdown(md));
                    } else {
                        profileCard.innerHTML = '<div class="error">介绍文件加载失败：profile/' + profileName + '.js</div>';
                    }
                });
            }

            function init() {
                const params = new URLSearchParams(window.location.search);
                const index = parseInt(params.get('i'), 10);
                const raw = (typeof window.STAR_APPS === 'string') ? window.STAR_APPS : '';
                const items = parseConfig(raw);
                if (isNaN(index) || index < 0 || index >= items.length) {
                    detailRoot.innerHTML =
                        '<div class="not-found"><h1>没有找到这个应用</h1>' +
                        '<p>它可能已被下架，<a href="index.html" style="color: var(--btn-blue)">返回服务列表</a>看看其他软件吧。</p></div>';
                    return;
                }
                buildPage(items[index]);
            }

            const douyinUrl = 'https://www.douyin.com/user/MS4wLjABAAAASkP1rl3lePnPAJcRz-M6INTL8-ZDWvJEXXUiWe1KAlXclwL1qcGjjyotx4NvjLCf?from_tab_name=main';
            const githubUrl = 'https://github.com/wbzmm2025/star.github.io';

            const aboutLink = document.getElementById('about-link');
            const serviceLink = document.getElementById('service-link');
            const contactLink = document.getElementById('contact-link');

            const footerAboutLink = document.getElementById('footer-about-link');
            const footerServiceLink = document.getElementById('footer-service-link');
            const footerContactLink = document.getElementById('footer-contact-link');

            const douyinLink = document.getElementById('douyin-link');
            const githubLink = document.getElementById('github-link');

            if (aboutLink) {
                aboutLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    scrollToFooter();
                });
            }

            if (footerAboutLink) {
                footerAboutLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    scrollToFooter();
                });
            }

            if (serviceLink) {
                serviceLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    scrollToTop();
                });
            }

            if (footerServiceLink) {
                footerServiceLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    scrollToTop();
                });
            }

            if (contactLink) {
                contactLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    scrollToFooter();
                });
            }

            if (footerContactLink) {
                footerContactLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    scrollToFooter();
                });
            }

            if (douyinLink) {
                douyinLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.open(douyinUrl, '_blank');
                });
            }

            if (githubLink) {
                githubLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.open(githubUrl, '_blank');
                });
            }

            init();
        })();
    </script>
</body>
</html>
